name: Frontend checks
on:
  pull_request:
  push:
    branches: [main, codex/vite-verification]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Match the Windows npm version
        run: npm install --global npm@10.1.0
      - name: Generate the replacement lockfile
        run: npm install --prefix client --package-lock-only
      - name: Install the committed frontend dependencies
        run: npm ci --prefix client
      - name: Lint and build the frontend
        run: npm run build --prefix client
      - name: Audit all frontend dependencies
        run: npm audit --prefix client --audit-level=low
      - name: Check private runtime configuration
        run: npm run test:config
      - name: Install the smoke-test browser
        run: npm exec --prefix client -- playwright install --with-deps --only-shell chromium
      - name: Check browser pages and API forwarding
        run: npm run test:smoke --prefix client
      - name: Export generated lockfile for the verified commit
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const encoded = readFileSync('client/package-lock.json').toString('base64');
          for (let i = 0; i < encoded.length; i += 2000) {
            console.log('LOCK_B64:' + (i / 2000) + ':' + encoded.slice(i, i + 2000));
          }
          NODE

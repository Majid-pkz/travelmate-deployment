name: Backend and account checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        hosting: [same-origin, separate-origins]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/travelmate_test_ci
      VITE_API_URL: ${{ matrix.hosting == 'separate-origins' && 'http://127.0.0.1:3001' || '' }}
      ALLOWED_ORIGINS: ${{ matrix.hosting == 'separate-origins' && 'http://127.0.0.1:3000' || '' }}
      SERVE_CLIENT: ${{ matrix.hosting == 'separate-origins' && 'false' || 'true' }}
      RUN_SPLIT_BROWSER_TESTS: ${{ matrix.hosting == 'separate-origins' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Match the Windows npm version
        run: npm install --global npm@10.1.0
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix server
          npm ci --prefix client
      - name: Check all dependency audits
        run: |
          npm audit --audit-level=low
          npm audit --prefix server --audit-level=low
          npm audit --prefix client --audit-level=low
      - name: Check runtime configuration and authentication
        run: |
          npm run test:config
          npm run test:server
      - name: Build the production frontend
        run: npm run build --prefix client
      - name: Install the account-test browser
        run: npm exec --prefix client -- playwright install --with-deps --only-shell chromium
      - name: Check real database and production browser flows
        run: NODE_ENV=production RUN_BROWSER_TESTS=true npm run test:integration --prefix server
